version: "3.9"

services:
  backend:
    build: ./backend
    container_name: secureeye_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - secureeye_db:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/secureeye.db
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: secureeye_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  secureeye_db:
